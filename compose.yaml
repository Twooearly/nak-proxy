services:
  nak-proxy:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ARCHIVE_PATH=/data/archive.db
      # optional: POLL_MINUTEN=30, DISCOVERY_STUNDEN=24, ZUSATZ_ZENTURIEN=A26a,W26a
    volumes:
      - calendar-data:/data
    restart: unless-stopped

volumes:
  calendar-data:
    # fester Name: bleibt gleich, auch wenn das Verzeichnis umbenannt wird (Archiv!)
    name: calendar-proxy_calendar-data
