[project]
name = "nak-proxy"
version = "0.1.0"
description = "Flask proxy for the Nordakademie timetable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.2",
    "icalendar>=7.0.0",
    "requests>=2.32.5",
    "gunicorn>=22.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "archive", "import_ics"]
